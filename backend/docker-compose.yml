services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: stride
      POSTGRES_PASSWORD: stride
      POSTGRES_DB: stride
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stride"]
      interval: 2s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
