[project]
name = "stride-backend"
version = "0.1.0"
description = "Stride API — FastAPI + Postgres"
authors = [
    { name = "adc", email = "2780.adc@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.7",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = ["B008"]  # FastAPI's Depends()-as-default is the idiomatic pattern

[tool.pytest.ini_options]
testpaths = ["tests"]
